<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ ui.get('team_title', 'Наша команда') }}  {{ event.event_title }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="/static/css/design.css" rel="stylesheet" />
  <link rel="/static/css/design.css?v=1795435202" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/design.css?v=1795435224" />
</head>
<body>
  <div class="container">
    {% include "nav_partial.html" %}

    <div class="card">
      <h1 style="margin: 0; font-size: 24px;">{{ ui.get('team_title', 'Наша команда') }}</h1>
    </div>

    {% for committee_name, members in committees.items() %}
      <div class="card">
        <h2 style="margin-top: 0; font-size: 19px;">{{ committee_name }}</h2>
        <div class="grid-2">
          {% for org in members %}
            <div class="card" style="margin-bottom: 0; padding: 14px; display: flex; gap: 12px; align-items: center;">
              <img src="{{ org.photo or '/static/uploads/avatars/default_person.svg' }}" alt="{{ org.name }}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0;" />
              <div style="min-width: 0;">
                <div style="font-weight: 700;">{{ org.name }}</div>
                <div class="muted" style="font-size: 13px;">{{ org.role }}</div>
              </div>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endfor %}

    {% if event.org_info_enabled %}
      <div class="card" style="text-align: center;">
        <a class="btn btn-primary" href="/org-info" style="width: 100%; max-width: 360px;">Я организатор</a>
      </div>
    {% endif %}
  </div>  <script src="/static/js/design_motion.js?v=1795435224" defer></script>
</body>
</html>
